name: Supabase Keep-Alive

# Supabase free-tier projects pause after 7 days of inactivity.
# This workflow sends a lightweight read request every 3 days so the
# database registers activity and stays active.

on:
  schedule:
    # At 06:00 UTC every 3rd day of the month (approx. every ~3 days).
    - cron: "0 6 */3 * *"
  # Allow running manually from the Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          # Lightweight read: fetch at most 1 row from the 'articles' table.
          # HEAD-style request keeps the response tiny while still counting as DB activity.
          echo "Pinging Supabase to keep the project active..."
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/articles?select=id&limit=1")

          echo "HTTP status: ${HTTP_CODE}"
          cat /tmp/body.txt || true

          # 2xx responses mean the database answered (activity registered).
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Keep-alive successful."
          else
            echo "::error::Keep-alive request failed with status ${HTTP_CODE}."
            exit 1
          fi
